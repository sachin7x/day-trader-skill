name: tests
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
